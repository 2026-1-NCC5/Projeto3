<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether AI - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0f5238",
                        "primary-container": "#2d6a4f",
                        "surface": "#f8f9fa",
                        "surface-container": "#edeeef",
                        "on-surface": "#191c1d",
                        "on-surface-variant": "#404943",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                    },
                    fontFamily: {
                        "headline": ["Manrope", "sans-serif"],
                        "body": ["Work Sans", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Work Sans', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 md:p-12 rounded-2xl shadow-xl w-full max-w-md border border-surface-container">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-primary tracking-tight">Aether AI</h1>
            <p class="text-on-surface-variant text-sm uppercase tracking-widest mt-1 opacity-80">Conscious Curation</p>
            <h2 class="text-2xl font-bold mt-8">Bem-vindo de volta!</h2>
            <p class="text-on-surface-variant text-sm mt-2">Faça login para continuar</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="mb-6 p-4 bg-error-container text-on-error-container rounded-xl text-sm font-medium">
              {% for message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-bold text-on-surface-variant mb-2">Nome de Usuário</label>
                <input type="text" id="username" name="username" required 
                       class="w-full px-4 py-3 rounded-xl bg-surface-container border-none focus:ring-2 focus:ring-primary transition-all"
                       placeholder="Digite seu usuário">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-bold text-on-surface-variant mb-2">Senha</label>
                <input type="password" id="password" name="password" required 
                       class="w-full px-4 py-3 rounded-xl bg-surface-container border-none focus:ring-2 focus:ring-primary transition-all"
                       placeholder="Digite sua senha">
            </div>
            
            <button type="submit" class="w-full py-3 bg-gradient-to-br from-primary to-primary-container text-white font-bold rounded-xl hover:opacity-90 transition-all shadow-sm">
                Entrar
            </button>
        </form>

        <p class="text-center mt-8 text-on-surface-variant text-sm font-medium">
            Não tem uma conta? <a href="{{ url_for('register') }}" class="text-primary font-bold hover:underline">Criar agora</a>
        </p>
    </div>
</body>
</html>
